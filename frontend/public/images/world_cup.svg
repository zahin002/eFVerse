<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 550" width="400" height="550">
  <defs>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="malachiteGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="globeGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
  </defs>

  <g id="fifa-world-cup-trophy">
    <!-- BASE PEDESTAL -->
    <!-- Base Bottom Tier -->
    <rect x="100" y="460" width="200" height="40" rx="6" fill="#1e293b" stroke="url(#trophyGold)" stroke-width="4"/>
    
    <!-- Malachite Green Bands -->
    <rect x="110" y="470" width="180" height="8" fill="url(#malachiteGreen)"/>
    <rect x="110" y="484" width="180" height="8" fill="url(#malachiteGreen)"/>
    
    <!-- Base Gold Stem Collar -->
    <path d="M 120 460 C 140 430 160 410 160 380 L 240 380 C 240 410 260 430 280 460 Z" fill="url(#trophyGold)"/>

    <!-- TWO ATHLETES HOLDING THE GLOBE (STEM) -->
    <!-- Left Athlete Body & Arm -->
    <path d="M 160 380 C 130 320 140 250 175 200 C 160 250 170 300 200 340 C 180 360 170 370 160 380 Z" fill="url(#trophyGold)"/>
    
    <!-- Right Athlete Body & Arm -->
    <path d="M 240 380 C 270 320 260 250 225 200 C 240 250 230 300 200 340 C 220 360 230 370 240 380 Z" fill="url(#trophyGold)"/>

    <!-- Dynamic Curved Spiral Wrap -->
    <path d="M 155 350 Q 200 310 245 350 Q 200 380 155 350 Z" fill="url(#trophyGold)" opacity="0.9"/>
    <path d="M 165 270 Q 200 240 235 270 Q 200 300 165 270 Z" fill="url(#trophyGold)" opacity="0.9"/>

    <!-- TOP GLOBE (EARTH) -->
    <circle cx="200" cy="140" r="90" fill="url(#globeGlow)" stroke="#78350f" stroke-width="4"/>

    <!-- World Map Continents Lines on Globe -->
    <path d="M 130 120 C 150 90 190 80 230 110 C 210 140 170 160 130 120 Z" fill="#b45309" opacity="0.4"/>
    <path d="M 160 170 C 180 140 240 150 260 180 C 230 210 180 200 160 170 Z" fill="#b45309" opacity="0.4"/>
    
    <!-- Lat/Long Lines -->
    <path d="M 110 140 H 290" stroke="#fef08a" stroke-width="2" opacity="0.4"/>
    <path d="M 200 50 V 230" stroke="#fef08a" stroke-width="2" opacity="0.4"/>
    <ellipse cx="200" cy="140" rx="55" ry="85" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
